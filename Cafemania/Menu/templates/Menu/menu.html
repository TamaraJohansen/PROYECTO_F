{% extends 'base.html' %}
{% block contenido %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Cafemanía</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h2>Nuestro menú</h2>
    <p>Aquí aparecerán los productos.</p>
    
    {% for producto in catalogo %}
    <div class="producto">
        <h3>{{ producto.nombre }}</h3>
        <p>Precio: ${{ producto.precio }}</p>
        <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" width="250">
    </div> 
    <hr>   
    {% endfor %}        
</body>
</html>
{% endblock %}
