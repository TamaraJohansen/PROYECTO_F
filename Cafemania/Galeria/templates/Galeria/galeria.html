{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Cafemanía</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h2>Galería</h2>
    <p>Aquí aparecerán las imágenes.</p>
    
    <ul>
        {% for foto in catalogo %}
            <li>
                <h3>{{ foto.titulo }}</h3>
                <img src="{{ foto.imagen.url }}" alt="{{ foto.titulo }}">
            </li>
        {% endfor %}
        </ul>

</body>
</html>
