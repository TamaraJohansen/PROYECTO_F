{% extends 'base.html' %}
{% block contenido %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Cafemanía</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h2>Galería</h2>
    <p>Aquí aparecerán las imágenes.</p>

    {% for foto in catalogo %}
    <div>
        <img src="{{ foto.imagen.url }}" alt="{{ foto.titulo }}" width="250">
        <p>{{ foto.titulo }}</p> 
    </div>
     {% endfor %}

</body>
</html>
{% endblock %}
